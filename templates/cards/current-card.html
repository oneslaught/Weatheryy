<section class="card card-current">
  <h2 class="card-title">Currently</h2>
  <div class="current-main">
    <span class="current-icon" aria-hidden="true">🕰️</span>
    <div>
      <h1 class="current-title">{{ data.current.local_date }}</h1>
      <p class="current-desc">{{ data.current.weekday }}</p>
    </div>
  </div>
  <p class="current-data">{{ data.current.local_time }}</p>
  <div class="current-main">
    <span class="current-icon" aria-hidden="true">{{ data.current.icon }}</span>
    <div>
      <h1 class="current-title">{{ data.current.description }}</h1>
    </div>
  </div>
  <p class="current-data">{{ data.current.temperature }}°</p>
  <ul class="stats">
    <li class="stats-row">
      <span>Cloudy</span><span class="stats-line"></span
      ><strong>{{ data.current.cloud_cover }}%</strong>
    </li>
    <li class="stats-row">
      <span>Humidity</span><span class="stats-line"></span
      ><strong>{{ data.current.humidity }}%</strong>
    </li>
  </ul>
</section>
