<section class="card card-sun">
  <h2 class="card-title">Sun today</h2>
  <p class="sun-status">{{ data.current.sun_status }}</p>

  <div class="sun-times">
    <div class="sun-item">
      <span class="sun-icon" aria-hidden="true">🌅</span>
      <span class="sun-label">Sunrise</span>
      <strong class="sun-value">{{ data.current.sunrise }}</strong>
    </div>
    <div class="sun-item" title="Time between sunrise and sunset">
      <span class="sun-icon" aria-hidden="true">☀️</span>
      <span class="sun-label">Sun is up for</span>
      <strong class="sun-value">{{ data.current.daylight }}</strong>
    </div>
    <div class="sun-item">
      <span class="sun-icon" aria-hidden="true">🌇</span>
      <span class="sun-label">Sunset</span>
      <strong class="sun-value">{{ data.current.sunset }}</strong>
    </div>
  </div>
</section>
