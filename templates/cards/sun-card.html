<section class="card card-sun">
  <h2 class="card-title">Sun and rain today</h2>
  <div class="sun">
    <div class="sun-item">
      <span class="sun-icon" aria-hidden="true">🌅</span>
      <span class="sun-label">Sunrise</span>
      <strong class="sun-value">{{ data.current.sunrise }}</strong>
    </div>
    <div class="sun-item">
      <span class="sun-icon" aria-hidden="true">🌇</span>
      <span class="sun-label">Sunset</span>
      <strong class="sun-value">{{ data.current.sunset }}</strong>
    </div>
    <div class="sun-item">
      <span class="sun-icon" aria-hidden="true">💧</span>
      <span class="sun-label">Rain chance</span>
      <strong class="sun-value">
        {% if data.current.precipitation_probability is not none %}{{
        data.current.precipitation_probability }}%{% else %}-{% endif %}
      </strong>
    </div>
  </div>
</section>
