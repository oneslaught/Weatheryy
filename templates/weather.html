{% extends "base.html" %}

{% block title %}{{ city }} - Weather{% endblock %}

{% block content %}
<header class="topbar">
  {% include "_search.html" %}
</header>

<div class="dashboard">
  {% if place %}
    <h1>{{ place.name }}, {{ place.country }}</h1>
  {% else %}
    <h1>Nothing found for "{{ city }}"</h1>
  {% endif %}
</div>
{% endblock %}
