<form class="search" action="{{ url_for('weather') }}" method="get">
  <input
    class="search-input"
    type="text"
    name="city"
    placeholder="Find city..."
    autocomplete="off"
    required
    {% if autofocus %}autofocus{% endif %}
  />
  <button class="search-button" type="submit" aria-label="Find">Find</button>
</form>
