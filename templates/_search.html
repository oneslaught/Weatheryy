<div class="theme-switch" role="group" aria-label="Color theme">
  <button
    class="{{ 'active' if theme == 'green' }}"
    type="button"
    data-theme-value="green"
  >
    Green
  </button>
  <button
    class="{{ 'active' if theme == 'pink' }}"
    type="button"
    data-theme-value="pink"
  >
    Pink
  </button>
</div>
<form class="search" action="{{ url_for('weather') }}" method="get">
  <input
    class="search-input"
    type="text"
    name="city"
    value="{{ city or '' }}"
    placeholder="Find city..."
    autocomplete="off"
    required
    {%
    if
    autofocus
    %}autofocus{%
    endif
    %}
  />
  <input type="hidden" name="unit" value="{{ unit or 'c'}}" />
  <button class="search-button" type="submit" aria-label="Find">Find</button>
</form>
